services:
  # Web Service
  - type: web
    name: quran-hafalan-app
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 10000
      # Database credentials from PlanetScale
      # Set these manually in Render dashboard after getting from PlanetScale
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: quran-hafalan
      - key: DB_PORT
        value: 3306

