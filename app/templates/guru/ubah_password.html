{% extends "base.html" %}
{% block title %}Ubah Password{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Ubah Password</h1>
    <p>Perbarui kata sandi akun Anda</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-5 col-xl-4" style="width: 80%;">
        <div class="app-card">
            <div class="app-card-header dark">
                <div style="display:flex; align-items:center; gap:.6rem;">
                    <i class="fas fa-lock" style="color:rgba(255,255,255,.7);"></i>
                    <h2>Ganti Password</h2>
                </div>
            </div>
            <div class="app-card-body">
                <form method="POST" action="/guru/ubah-password" id="formUbahPw">
                    <div class="mb-3">
                        <label class="form-label">Password Lama</label>
                        <div class="input-group">
                            <input type="password" name="password_lama" id="pwLama"
                                   class="form-control" required placeholder="Password saat ini">
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="togglePw('pwLama', this)" tabindex="-1">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password Baru</label>
                        <div class="input-group">
                            <input type="password" name="password_baru" id="pwBaru"
                                   class="form-control" minlength="6" required placeholder="Minimal 6 karakter">
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="togglePw('pwBaru', this)" tabindex="-1">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Konfirmasi Password Baru</label>
                        <div class="input-group">
                            <input type="password" name="konfirmasi" id="pwKonfirmasi"
                                   class="form-control" minlength="6" required placeholder="Ketik ulang password baru">
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="togglePw('pwKonfirmasi', this)" tabindex="-1">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small id="matchInfo"></small>
                    </div>

                    <button type="submit" class="btn-primary-app w-100" style="justify-content:center; padding:.65rem;">
                        <i class="fas fa-floppy-disk"></i> Simpan Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon  = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

document.getElementById('pwKonfirmasi').addEventListener('input', function() {
    const info = document.getElementById('matchInfo');
    const baru = document.getElementById('pwBaru').value;
    if (!this.value) { info.textContent = ''; return; }
    if (this.value === baru) {
        info.textContent = '✓ Password cocok';
        info.className = 'form-hint text-success';
    } else {
        info.textContent = '✗ Password tidak cocok';
        info.className = 'form-hint text-danger';
    }
});

document.getElementById('formUbahPw').addEventListener('submit', function(e) {
    if (document.getElementById('pwBaru').value !== document.getElementById('pwKonfirmasi').value) {
        e.preventDefault();
        alert('Password baru dan konfirmasi tidak cocok');
    }
});
</script>
{% endblock %}
