{% extends "base.html" %}
{% block title %}Login — Hafalan Al-Qur'an{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <!-- Logo & title -->
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-book-quran"></i>
            </div>
            <h1>Hafalan Al-Qur'an</h1>
            <p class="text-muted">Sistem Monitoring Hafalan</p>
        </div>

        {% if error %}
        <div class="app-alert danger" style="margin-bottom: 1.25rem;">
            <i class="fas fa-circle-xmark"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-field">
                <label class="form-label">NIS / NUPTK / Email</label>
                <input type="text" name="identifier" class="form-control"
                       placeholder="Masukkan NIS, NUPTK, atau Email" required autofocus>
            </div>

            <div class="mb-field">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Password" required>
                <p class="form-hint">Login pertama: password = NIS / NUPTK</p>
            </div>

            <button type="submit" class="btn-primary-app w-100" style="justify-content:center; padding:.7rem 1.25rem; font-size:15px;">
                <i class="fas fa-right-to-bracket"></i> Masuk
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2024 Sistem Hafalan Al-Qur'an</p>
        </div>
    </div>
</div>

<style>
body { background-color: var(--c-bg); }

/* Override main-content padding for login */
.main-content .page-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 0px);
    padding: 2rem 1rem;
}

.login-wrap {
    width: 100%;
    max-width: 400px;
}

.login-card {
    background: var(--c-white);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2.5rem 2rem;
}

.login-header {
    text-align: center;
    margin-bottom: 2rem;
}
.login-logo {
    width: 68px; height: 68px;
    border-radius: 16px;
    background-color: var(--c-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
}
.login-logo i {
    color: var(--c-white);
    font-size: 1.75rem;
}
.login-header h1 { font-size: 22px; margin-bottom: .25rem; }
.login-header p  { font-size: 14px; }

.mb-field { margin-bottom: 1.25rem; }

.login-footer {
    text-align: center;
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--c-border);
}
.login-footer p { color: var(--c-neutral); font-size: 12px; margin: 0; }

@media (max-width: 480px) {
    .login-card { padding: 2rem 1.25rem; }
}
</style>
{% endblock %}
