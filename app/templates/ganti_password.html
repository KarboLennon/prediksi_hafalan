{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}

{% block content %}
<div style="max-width:440px; margin:2rem auto;">
    <div class="app-card">
        <div class="app-card-header dark">
            <div style="display:flex; align-items:center; gap:.75rem;">
                <div class="stat-icon accent" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;margin:0;">
                    <i class="fas fa-lock" style="font-size:1.1rem;"></i>
                </div>
                <div>
                    <h2 style="color:var(--c-white);">Buat Password Baru</h2>
                    <p style="color:rgba(255,255,255,.75);font-size:13px;margin:0;">Ini adalah login pertama Anda</p>
                </div>
            </div>
        </div>
        <div class="app-card-body">
            {% if error %}
            <div class="app-alert danger">
                <i class="fas fa-circle-xmark"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="app-alert info" style="margin-bottom:1.25rem;">
                <i class="fas fa-circle-info"></i>
                <span>Demi keamanan, silakan ganti password default Anda sebelum melanjutkan.</span>
            </div>

            <form method="POST" action="/ganti-password">
                <div style="margin-bottom:1.1rem;">
                    <label class="form-label">Password Baru</label>
                    <input type="password" name="password_baru" class="form-control"
                           minlength="6" placeholder="Minimal 6 karakter" required>
                </div>
                <div style="margin-bottom:1.5rem;">
                    <label class="form-label">Konfirmasi Password</label>
                    <input type="password" name="konfirmasi" class="form-control"
                           minlength="6" placeholder="Ketik ulang password" required>
                </div>
                <button type="submit" class="btn-primary-app w-100" style="justify-content:center; padding:.7rem; font-size:15px;">
                    <i class="fas fa-check"></i> Simpan Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
