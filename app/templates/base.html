<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hafalan Monitoring{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #1a7a4c, #2d9b6e) !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .badge-admin { background: #dc3545; }
        .badge-guru { background: #0d6efd; }
        .badge-siswa { background: #198754; }
        .stat-card { text-align: center; padding: 1.5rem; }
        .stat-card h2 { font-size: 2rem; font-weight: 700; margin: 0; }
        .stat-card small { color: #6c757d; }
    </style>
</head>
<body>
    {% if user %}
    <nav class="navbar navbar-dark px-3">
        <span class="navbar-brand mb-0 h1">Hafalan Monitoring</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">{{ user.nama }}</span>
            <span class="badge badge-{{ user.role }}">{{ user.role }}</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>
    {% endif %}

    <div class="container py-4">
        {% if alert %}
        <div class="alert alert-{{ alert.type }} alert-dismissible fade show">
            {{ alert.message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
